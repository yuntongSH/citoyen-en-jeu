name: Publish Citoyen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          CITOYEN_SUPABASE_URL: ${{ vars.CITOYEN_SUPABASE_URL }}
          CITOYEN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CITOYEN_SUPABASE_PUBLISHABLE_KEY }}
          CITOYEN_PRIVACY_CONTACT: ${{ vars.CITOYEN_PRIVACY_CONTACT }}
          CITOYEN_ACCOUNTS_READY: ${{ vars.CITOYEN_ACCOUNTS_READY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
